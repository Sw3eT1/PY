<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Data Points</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/static/style.css">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="text-primary">Data Points List</h1>
        <div>
            <a href="/predict" class="btn btn-info me-2 text-white">Predict Category</a>
            <a href="/add" class="btn btn-success">Add New Data Point</a>
        </div>
    </div>

    <div class="card shadow table-card">
        <div class="card-body">

            <table id="data-table" class="table table-striped table-hover">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Feature 1</th>
                    <th>Feature 2</th>
                    <th>Category</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody id="data-body">
                </tbody>
            </table>

            <p id="empty-message" class="text-muted d-none">No data stored yet.</p>

        </div>
    </div>

</div>

<script src="/static/main.js"></script>

</body>
</html>
