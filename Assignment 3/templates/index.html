<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Data Points</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/static/style.css">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="text-primary">Data Points List</h1>
        <div>
            <a href="/predict" class="btn btn-info me-2 text-white">Predict Category</a>
            <a href="/add" class="btn btn-success">Add New Data Point</a>
        </div>
    </div>

    <div class="card shadow table-card">
        <div class="card-body">

            <table id="data-table" class="table table-striped table-hover">
                <thead>
                    <tr>
                      <th>Lp.</th>
                      <th>ID</th>
                      <th>Feature 1</th>
                      <th>Feature 2</th>
                      <th>Category</th>
                      <th>Action</th>
                    </tr>
                </thead>

              <tbody>
                {% for item in data %}
                  <tr>
                    <td>{{ loop.index }}</td>
                    <td>{{ item.id }}</td>
                    <td>{{ item.feature1 }}</td>
                    <td>{{ item.feature2 }}</td>
                    <td>{{ item.category }}</td>
                    <td>
                      <form action="{{ url_for('web.delete', record_id=item.id) }}" method="POST">
                        <button class="btn btn-danger btn-sm" type="submit">Delete</button>
                      </form>
                    </td>
                  </tr>
                {% endfor %}
              </tbody>
            </table>

            {% if data|length == 0 %}
              <p class="text-muted">No data stored yet.</p>
            {% endif %}

        </div>
    </div>

</div>

</body>
</html>
