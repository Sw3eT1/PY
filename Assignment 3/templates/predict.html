<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Predict Category</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h1 class="text-primary">Predict Category</h1>
    <form method="POST" class="mt-4 card p-4 shadow">
        <div class="mb-3">
            <label class="form-label">Feature 1</label>
            <input type="number" step="any" name="feature1" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Feature 2</label>
            <input type="number" step="any" name="feature2" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Predict</button>
        <a href="/" class="btn btn-secondary ms-2">Back to Home</a>
    </form>
</div>
</body>
</html>
