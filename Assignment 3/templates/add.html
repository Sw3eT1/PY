<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Data Point</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow-sm">
        <div class="card-body">

            <h2 class="text-primary mb-4">Add New Data Point</h2>

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Feature 1</label>
                    <input type="number" step="any" name="feature1" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Feature 2</label>
                    <input type="number" step="any" name="feature2" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Category (integer)</label>
                    <input type="number" name="category" class="form-control" required>
                </div>

                <button class="btn btn-success">Add</button>
                <a href="/" class="btn btn-secondary">Back</a>
            </form>

        </div>
    </div>
</div>

</body>
</html>
